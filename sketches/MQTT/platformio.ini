; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

# default speed for serial operations
# use `pio device monitor -b 115200` for the command line serial monitor
monitor_speed = 115200

# two dependencies required for the DS18B20 temperature sensor
# one dependency required for MQTT messaging
lib_deps = 
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0
    knolleary/PubSubClient
    fastled/FastLED @ ^3.9.2

lib_extra_dirs = $PROJECT_DIR/../../shared_lib

# extra_scripts = post:extra_script.py

# g++ build flags added for strict checking
# requires `pio run -t upload | grep -v framework | tee compiler_messages.txt
# build_flags = -Wall -Wextra -Wpedantic


